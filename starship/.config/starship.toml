"""

[python]
# Muestra el nombre del virtualenv entre paréntesis
format = '([$virtualenv]($style) )'
style = 'bold yellow'

[cmd_duration]
min_time = 2000
format = " took [$duration]($style)"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#F6F5F4 fg:#3D3846 bold"
# format = '[ ♥ $time ]($style)'
format = '[$time ]($style)'

[character]
disabled = false
success_symbol = "[](bg:#1E1B1A fg:#1E1B1A)"
error_symbol = "[❌](bg:#282828 fg:#E66100)"
#error_symbol = "[× ](bg:#282828 fg:#E66100)"
# format = '[ ♥ $time ]($style)'
format = "$symbol"

