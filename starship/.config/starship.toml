[](fg:#60b5cc)\
"""

[git_branch]
symbol = " "
# Este es el color cuando la rama está limpia y actualizada (verde)
style = "bg:#8ec07c fg:#282828 bold"
format = """\
[](fg:#303846 bg:#8ec07c)\
[ $symbol $branch ]($style)\
"""

[git_status]
style = "bg:#8ec07c fg:#282828 bold"
format = """\
[ $all_status$ahead_behind ]($style)\
[](fg:#8ec07c)\
"""

# Golang
