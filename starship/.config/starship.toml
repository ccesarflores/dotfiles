
format = """
[](fg:#282828 bg:#282828)\
$python\
$character\
$battery$username$hostname$shell\
$directory\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nim\
$rust\
[ ](fg bg)\
"""
#[](fg:#303846 bg:#303846)\

# Disable the blank line at the start of the prompt
add_newline = false

[os]
style = "bg:#5E5C64 fg:#F6F5F4 bold"
format = "[$symbol]($style)"
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[shell]
style = "bg:#5E5C64 fg:#F6F5F4 bold"
format = "[$indicator]($style)"
disabled = false
fish_indicator = ' 󰈺'
powershell_indicator = ' '
bash_indicator = ''
zsh_indicator = ''

[battery]
format = '[$symbol$percentage ]($style)'

# Símbolos base (por si no hay display específico)
full_symbol = '󰁹 '       # lleno (verde o blanco)
charging_symbol = '󰂄 '    # cargando (rayo)
discharging_symbol = '󰂃 ' # descargando (por defecto)
empty_symbol = '󰂎 '       # vacío (rojo o alerta)

# Solo aparece si batería ≤ 20% (ajusta thresholds a tu gusto)
[[battery.display]]
threshold = 20
#style = 'bg:#fab387 fg:#000000 bold'   # naranja suave + negro (advertencia media)
style = 'bg:#1E1B1A fg:#fab387 bold'   # naranja suave + negro (advertencia media)
discharging_symbol = '󰁻 '             # icono medio-bajo

[[battery.display]]
threshold = 15
# style = 'bg:#5E5C64 fg:#FFFFFF bold blink'   # rojo rosado + blanco
style = 'bg:#1E1B1A fg:#FFFFFF bold blink'   # letra blanca + fondo oscuro 
discharging_symbol = '󰁺 '             # icono bajo

[[battery.display]]
threshold = 10
style = 'bg:#1E1B1A fg:#FFFFFF bold blink'  # rojo + PARPADEO (blink)
discharging_symbol = '󰂎 '             # icono vacío/crítica (o usa '󰂍 ' si querés más alerta)
#format = '[$symbol$percentage ]($style)[](fg:#f38ba8 bg:#5E5C64 blink)'
# You can also replace your username with a neat symbol like  to save some space

# Opcional: si está cargando en bajo, usa otro símbolo
charging_symbol = '󰂅 '  # rayo con carga (puedes definir por display si querés)

[username]
show_always = true
style_user = "bg:#282828 fg:#F6F5F4"
style_root = "bg:#282828 fg:#A51D2D"
format = '[$user]($style)'

[hostname]
style = "bg:#282828 fg:#F6F5F4"
format = '[@$hostname ]($style)[](fg:#1E1B1A bg:#131B1A)'
ssh_only = false 
disabled = false

[directory]
style = "bg:#458588 fg:#282828"
#style = "bg:#458588 fg:#000000"
#style = "bg:#0097A7 fg:#FFFFFF bold"
truncation_length = 3                  # muestra las últimas 3 carpetas
truncation_symbol = "…/"               # …/ para indicar truncado
# fish_style_pwd_dir_length = 1        # En el path verás algo como: U / c / m / u / t (iniciales + /)
truncate_to_repo = true                # si estás en git, trunca desde la raíz del repo
#home_symbol = " "                     # ~ → ícono de casa
read_only = " "                       # carpeta read-only

# formato gruvbox 
format = """\
[](fg:#282828 bg:#458588)\
[ $path ]($style)\
[](fg:#458588)\
"""

#format = """\
#[](fg:#5E5C64 bg:#0097A7)\
#[ $path ]($style)\
#[](fg:#0097A7)\
#"""

# C
[c]
symbol = " "
style = "bg:#6591c9 fg:#000000 bold"
format = """\
[](fg:#303846 bg:#6591c9)\
[ $symbol ($version) ]($style)\
[](fg:#6591c9)\
"""

# Elixir
[elixir]
